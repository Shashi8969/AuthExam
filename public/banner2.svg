<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid2" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#grid2)"/>

  <circle cx="1180" cy="200" r="320" fill="url(#glow2)" filter="url(#blur2)"/>
  <circle cx="260" cy="760" r="260" fill="#3B82F6" opacity="0.18" filter="url(#blur2)"/>

  <!-- Layered diagonal panels for a premium corporate feel -->
  <polygon points="0,900 700,900 1000,0 500,0" fill="#ffffff" opacity="0.035"/>
  <polygon points="900,900 1600,900 1600,300 1250,0 950,0" fill="#0F172A" opacity="0.12"/>

  <g fill="#ffffff" opacity="0.1">
    <circle cx="140" cy="150" r="2"/><circle cx="1500" cy="600" r="2"/>
    <circle cx="820" cy="120" r="2"/><circle cx="360" cy="480" r="2"/>
    <circle cx="1350" cy="820" r="2"/><circle cx="60" cy="620" r="2"/>
  </g>
</svg>
