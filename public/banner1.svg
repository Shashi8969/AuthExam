<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>

  <circle cx="1250" cy="220" r="260" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="220" cy="700" r="220" fill="url(#glow1)" filter="url(#blur1)" opacity="0.7"/>

  <!-- Coverage network: hub nodes connected by routes, evoking field operators & service centers -->
  <g stroke="#93C5FD" stroke-width="1.4" opacity="0.45">
    <path d="M180,650 L460,420 L760,520 L1040,300 L1340,380" fill="none"/>
    <path d="M460,420 L520,180" fill="none"/>
    <path d="M760,520 L900,700" fill="none"/>
    <path d="M1040,300 L1180,120" fill="none"/>
  </g>
  <g fill="#BFDBFE">
    <circle cx="180" cy="650" r="6"/>
    <circle cx="460" cy="420" r="7"/>
    <circle cx="760" cy="520" r="6"/>
    <circle cx="1040" cy="300" r="8"/>
    <circle cx="1340" cy="380" r="6"/>
    <circle cx="520" cy="180" r="5"/>
    <circle cx="900" cy="700" r="5"/>
    <circle cx="1180" cy="120" r="5"/>
  </g>
  <g fill="#F59E0B" opacity="0.85">
    <circle cx="1040" cy="300" r="3"/>
    <circle cx="460" cy="420" r="3"/>
  </g>

  <!-- Fine texture dots -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="90" cy="120" r="2"/><circle cx="1500" cy="180" r="2"/>
    <circle cx="1420" cy="640" r="2"/><circle cx="260" cy="300" r="2"/>
    <circle cx="1100" cy="780" r="2"/><circle cx="680" cy="150" r="2"/>
    <circle cx="1550" cy="760" r="2"/><circle cx="70" cy="800" r="2"/>
  </g>
</svg>
