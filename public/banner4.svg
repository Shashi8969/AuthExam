<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg4)"/>

  <!-- Flowing layered waves for a smooth, premium motion feel -->
  <path d="M0,560 C 260,480 420,640 700,580 S 1180,460 1600,540 L1600,900 L0,900 Z" fill="url(#wave2)"/>
  <path d="M0,640 C 300,720 560,560 860,640 S 1300,700 1600,630 L1600,900 L0,900 Z" fill="url(#wave1)"/>
  <path d="M0,740 C 340,660 640,820 960,740 S 1360,660 1600,740 L1600,900 L0,900 Z" fill="#0F172A" opacity="0.25"/>

  <g fill="#ffffff" opacity="0.14">
    <circle cx="180" cy="180" r="2.5"/><circle cx="420" cy="120" r="2"/>
    <circle cx="760" cy="220" r="2.5"/><circle cx="1040" cy="140" r="2"/>
    <circle cx="1320" cy="240" r="2.5"/><circle cx="1520" cy="120" r="2"/>
    <circle cx="90" cy="360" r="2"/><circle cx="900" cy="60" r="2"/>
  </g>
</svg>
