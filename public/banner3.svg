<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="50"/></filter>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <circle cx="300" cy="180" r="280" fill="url(#glow3)" filter="url(#blur3)"/>
  <circle cx="1350" cy="700" r="300" fill="#3B82F6" opacity="0.22" filter="url(#blur3)"/>

  <!-- Route line connecting service-center pins across a coverage area -->
  <path d="M120,760 C 380,560 520,780 700,560 S 1080,320 1480,220" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.55"/>

  <g>
    <!-- pin markers -->
    <g transform="translate(120,760)"><circle r="10" fill="#F59E0B"/><circle r="4" fill="#0F172A"/></g>
    <g transform="translate(700,560)"><circle r="9" fill="#3B82F6"/><circle r="3.5" fill="#0F172A"/></g>
    <g transform="translate(1080,320)"><circle r="9" fill="#3B82F6"/><circle r="3.5" fill="#0F172A"/></g>
    <g transform="translate(1480,220)"><circle r="11" fill="#F59E0B"/><circle r="4" fill="#0F172A"/></g>
  </g>

  <g fill="#ffffff" opacity="0.1">
    <circle cx="900" cy="120" r="2"/><circle cx="1550" cy="500" r="2"/>
    <circle cx="60" cy="420" r="2"/><circle cx="470" cy="820" r="2"/>
    <circle cx="1220" cy="800" r="2"/><circle cx="240" cy="60" r="2"/>
  </g>
</svg>
